<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contatos</title>
    <link rel="stylesheet" href="./contatos.css">
</head>
<body>
<div id="base-contato">
<div id="titulo">fale conosco!</div>
<div id="tudo">
    <label for="email">email</label>
        <input style="display:block" type="email" name="email" placeholder="coloque um email valido" />
        <label for="password">password</label> 
        <input style="display:block" id="password" type="password" name="password" placeholder="insira sua senha"/>

        <label for="checkbox">checkbox</label> 
        <input style="display:block" id="checkbox" type="checkbox" name="checkbox"/>

        <label for="masculino">masculino</label>
        <input style="display:block" id="radio" type="radio" name="sexo" value="maculino"/>

        <label for="feminino">feminino</label>
        <input style="display:block" id="radio" type="radio" name="sexo" value="feminino"/>

        <label for="outro">outro</label>
        <input style="display:block" id="radio" type="radio" name="sexo" value="outro"/>
        
        <textarea style="display: block;" name="mensagem" id="mensagem" rows="10"></textarea>
        <button>enviar</button>
</div>

</div>

    
</body>
</html>
